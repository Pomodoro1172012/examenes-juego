<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configurar examen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="configurador">

        <h1>⚙️ Configurar examen</h1>

        <p>Materia:</p>
        <input type="text" id="materia" placeholder="Ej: Historia">
<p>Cantidad de preguntas:</p>
<input type="number" id="cantidadPreguntas" min="1" max="50" value="10">

<h2>Preguntas</h2>

<div id="preguntas"></div>

<br>

<button type="button" onclick="generarPreguntas()">
    Crear preguntas
</button>

<br>
        <br><br>

        <button onclick="crearExamen()">
            Generar examen
        </button>

    </div>


    <script>
function generarPreguntas() {

    const cantidad = Number(
        document.getElementById("cantidadPreguntas").value
    );

    const contenedor = document.getElementById("preguntas");

    contenedor.innerHTML = "";

    for (let i = 0; i < cantidad; i++) {

        const bloque = document.createElement("div");

        bloque.className = "pregunta";

        bloque.innerHTML = `
            <hr>

            <h3>Pregunta ${i + 1}</h3>

            <p>Pregunta:</p>
            <input type="text" placeholder="Escribí la pregunta">

            <p>Respuesta 1:</p>
            <input type="text" placeholder="Respuesta">

            <p>Respuesta 2:</p>
            <input type="text" placeholder="Respuesta">

            <p>Respuesta 3:</p>
            <input type="text" placeholder="Respuesta">

            <p>Respuesta 4:</p>
            <input type="text" placeholder="Respuesta">

            <p>Respuesta correcta:</p>
            <select>
                <option value="0">Respuesta 1</option>
                <option value="1">Respuesta 2</option>
                <option value="2">Respuesta 3</option>
                <option value="3">Respuesta 4</option>
            </select>

            <br><br>
        `;

        contenedor.appendChild(bloque);
    }
}
        function crearExamen() {

            const materia =
                document.getElementById("materia").value.trim();

            const cantidad =
                document.getElementById("cantidadPreguntas").value;

            if (materia === "") {
                alert("Escribí el nombre de la materia.");
                return;
            }

            console.log("Materia:", materia);
            console.log("Cantidad de preguntas:", cantidad);

            alert("¡Configuración guardada!");

        }

    </script>

</body>

</html>
